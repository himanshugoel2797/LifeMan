<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}lifeman{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
        // Local-only server: inject the bearer token so browser fetch() can call /api/.
        // This must run in <head> before any body-level scripts read it.
        window.LIFEMAN_TOKEN = "{{ api_token | default('') }}";
    </script>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a25;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-dim: #8888a0;
            --accent: #6c8cff;
            --accent-hover: #8aa4ff;
            --success: #4caf80;
            --warning: #e6a040;
            --danger: #e05050;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-mono);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 14px;
        }
        .layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            min-height: 100vh;
        }
        nav {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        nav .brand {
            padding: 0 16px 20px;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }
        nav a {
            display: block;
            padding: 8px 16px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.15s;
        }
        nav a:hover, nav a.active {
            color: var(--text);
            background: var(--surface2);
        }
        nav a.active {
            border-left: 2px solid var(--accent);
        }
        .badge {
            display: inline-block;
            background: var(--danger);
            color: white;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 6px;
        }
        main {
            padding: 24px 32px;
            max-width: 1200px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--accent);
        }
        h2 {
            font-size: 16px;
            margin: 20px 0 12px;
            color: var(--text);
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-title {
            font-weight: bold;
            color: var(--text);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--text-dim);
            font-weight: normal;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover td {
            background: var(--surface2);
        }
        .btn {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            text-decoration: none;
            transition: all 0.15s;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-success {
            border-color: var(--success);
            color: var(--success);
        }
        .btn-success:hover {
            background: var(--success);
            color: var(--bg);
        }
        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }
        .btn-group {
            display: flex;
            gap: 6px;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            background: var(--surface2);
            color: var(--text-dim);
            border: 1px solid var(--border);
        }
        .tag-accent { border-color: var(--accent); color: var(--accent); }
        .tag-success { border-color: var(--success); color: var(--success); }
        .tag-warning { border-color: var(--warning); color: var(--warning); }
        pre, code {
            font-family: var(--font-mono);
            font-size: 13px;
        }
        pre {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .empty {
            color: var(--text-dim);
            text-align: center;
            padding: 40px;
        }
        .reason {
            color: var(--text-dim);
            font-size: 12px;
            font-style: italic;
        }
        .timestamp {
            color: var(--text-dim);
            font-size: 12px;
        }
        .chat-layout {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 48px);
            gap: 12px;
        }
        .chat-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .chat-stream {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 8px 4px;
        }
        .msg {
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 6px;
            padding: 10px 14px;
            max-width: 88%;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg-user {
            align-self: flex-end;
            background: var(--surface2);
            border-color: var(--accent);
        }
        .msg-assistant {
            align-self: flex-start;
        }
        .msg-tool {
            align-self: flex-start;
            background: #11161e;
            border-color: var(--border);
            font-size: 12px;
            color: var(--text-dim);
            max-width: 88%;
        }
        .msg-role {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        .chat-composer {
            display: flex;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .chat-composer textarea {
            flex: 1;
            font-family: inherit;
            font-size: 14px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 12px;
            min-height: 60px;
            resize: vertical;
        }
        .chat-composer textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .session-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .session-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
            color: var(--text);
        }
        .session-row:hover {
            border-color: var(--accent);
        }
        .tool-event {
            font-size: 11px;
            color: var(--warning);
            padding: 4px 0;
        }
    </style>
</head>
<body>
    <div class="layout">
        <nav>
            <div class="brand">lifeman</div>
            <a href="/" class="{% if active_page == 'index' %}active{% endif %}">Dashboard</a>
            <a href="/chat?surface=live_chat" class="{% if active_page == 'live_chat' %}active{% endif %}">Live Chat</a>
            <a href="/chat?surface=build_chat" class="{% if active_page == 'build_chat' %}active{% endif %}">Build Chat</a>
            <a href="/tools" class="{% if active_page == 'tools' %}active{% endif %}">Tools</a>
            <a href="/permissions" class="{% if active_page == 'permissions' %}active{% endif %}">
                Permissions
                {% if pending_permissions is defined and pending_permissions > 0 %}
                <span class="badge">{{ pending_permissions }}</span>
                {% endif %}
            </a>
            <a href="/schedules" class="{% if active_page == 'schedules' %}active{% endif %}">Schedules</a>
            <a href="/audit" class="{% if active_page == 'audit' %}active{% endif %}">Audit Log</a>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        // SSE for real-time updates
        const evtSource = new EventSource('/events');
        evtSource.addEventListener('permission_requested', (e) => {
            // Reload permissions badge
            location.reload();
        });
        evtSource.addEventListener('tool_registered', (e) => {
            if (window.location.pathname === '/tools' || window.location.pathname === '/') {
                location.reload();
            }
        });
    </script>
</body>
</html>
